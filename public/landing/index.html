<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market — скоро запуск</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#fff;--fg:#0b0b0b;--mut:#6b6b6b;--line:#e4e4e4;--card:#f5f5f5;--ac:#ff6a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#8f8f8f;--line:#222;--card:#121212;--ac:#ff7a1a}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#8f8f8f;--line:#222;--card:#121212;--ac:#ff7a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Helvetica Neue",Inter,Arial,sans-serif;display:grid;place-items:center;overflow:hidden}
.bl{position:fixed;inset:0;pointer-events:none}.bl i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.3;background:var(--ac);left:-12vmax;top:-14vmax;animation:mv 16s ease-in-out infinite alternate}
.bl i+i{left:auto;right:-14vmax;top:auto;bottom:-16vmax;background:var(--fg);opacity:.07;animation-duration:22s}
@keyframes mv{to{transform:translate(12vmax,8vmax) scale(1.2)}}
main{position:relative;width:min(560px,100% - 40px);text-align:center;padding:32px 0}
.lg{width:110px;height:auto;display:block;margin:0 auto 28px;animation:logoin 1.1s cubic-bezier(.2,.8,.2,1) both}
.lg{color:var(--ac);filter:drop-shadow(0 0 18px color-mix(in srgb,var(--ac) 60%,transparent))}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes logoin{0%{opacity:0;transform:scale(.6) rotate(-10deg);filter:blur(10px)}100%{transform:none}}
@keyframes rise{from{transform:translateY(24px);opacity:0;filter:blur(6px)}}
h1{font-size:clamp(44px,12vw,84px);letter-spacing:-.04em;line-height:1;margin:0 0 16px;animation:rise .8s .15s cubic-bezier(.2,.8,.2,1) both}
h1 span{color:var(--ac)}
p{color:var(--mut);margin:0 0 28px;animation:rise .8s .3s cubic-bezier(.2,.8,.2,1) both}
form{display:flex;gap:8px;padding:6px;border-radius:99px;background:var(--card);border:1px solid var(--line);animation:rise .8s .45s cubic-bezier(.2,.8,.2,1) both;transition:border-color .2s,transform .2s}
form:focus-within{border-color:var(--ac);transform:scale(1.02)}
input{flex:1;min-width:0;border:0;background:none;padding:0 16px;font:inherit;color:inherit;outline:none}
button{border:0;border-radius:99px;background:var(--ac);color:#000;font:inherit;font-weight:600;padding:14px 22px;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
button:active{transform:scale(.94)}
button::after{content:"";position:absolute;top:0;bottom:0;width:50%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sw 3.5s ease-in-out infinite}
@keyframes sw{55%,100%{left:140%}}
.er{color:var(--ac);min-height:22px;margin:10px 0 0;font-size:14px}
.ok{display:none;flex-direction:column;align-items:center;gap:10px}.ok.on{display:flex;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.ok svg{width:64px;height:64px;stroke:var(--ac);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:dr .6s .2s forwards}.ok circle{stroke-dasharray:70;stroke-dashoffset:70;animation:dr .7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<div class="bl"><i></i><i></i></div>
<main>
<svg class="lg" viewBox="0 0 797 724" aria-label="Market"><path fill="currentColor" fill-rule="evenodd" d="M405.0 10.0 L395.0 29.0 L234.0 392.0 L371.0 469.0 L374.0 472.0 L374.0 483.0 L366.0 489.0 L203.0 581.0 L202.0 573.0 L208.0 528.0 L218.0 417.0 L10.0 712.0 L399.0 641.0 L400.0 489.0 L404.0 488.0 L572.0 581.0 L572.0 584.0 L429.0 647.0 L788.0 714.0 L560.0 387.0 L415.0 460.0 L409.0 461.0 L400.0 455.0 L401.0 265.0 L406.0 266.0 L550.0 360.0Z M70.0 673.0 L72.0 667.0 L180.0 515.0 L183.0 516.0 L183.0 525.0 L172.0 629.0 L368.0 517.0 L374.0 517.0 L374.0 617.0 L372.0 619.0 L77.0 674.0Z M442.0 476.0 L552.0 421.0 L721.0 662.0 L728.0 675.0 L713.0 674.0 L522.0 638.0 L521.0 635.0 L635.0 585.0 L445.0 481.0Z M405.0 78.0 L459.0 205.0 L492.0 288.0 L489.0 289.0 L374.0 215.0 L374.0 438.0 L370.0 439.0 L270.0 382.0 L268.0 377.0 L401.0 80.0Z"/></svg>
<h1>Coming <span>soon</span></h1>
<p>Маркетплейс аккаунтов PUBG Mobile. Оставьте e-mail, и мы сообщим о запуске первыми.</p>
<form id="f" novalidate><input id="e" type="email" placeholder="you@example.com" aria-label="E-mail" autocomplete="email"><button type="submit">Сообщить мне</button></form>
<p class="er" id="er" style="animation:none"></p>
<div class="ok" id="ok"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.2 3.2L17 9"/></svg><b>Спасибо! Мы напишем вам перед запуском</b></div>
</main>
<script>
var f=document.getElementById("f"),e=document.getElementById("e"),er=document.getElementById("er"),ok=document.getElementById("ok");
try{if(localStorage.getItem("mk_mail")){f.style.display="none";er.style.display="none";ok.classList.add("on")}}catch(x){}
f.addEventListener("submit",function(ev){ev.preventDefault();var v=e.value.trim();
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){er.textContent="Введите корректный e-mail";f.animate([{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:300});return}
 try{localStorage.setItem("mk_mail",v)}catch(x){}
 f.style.display="none";er.style.display="none";ok.classList.add("on")});
</script>
</body>
</html>
