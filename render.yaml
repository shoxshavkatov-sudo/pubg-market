# Один сервис: Node-сервер раздаёт и сайт (папка public), и API чата/объявлений.
services:
  - type: web
    name: pubg-market
    runtime: node
    plan: free
    buildCommand: echo "No dependencies to install"
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
